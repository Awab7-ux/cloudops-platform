global:
  evaluation_interval: 15s
  scrape_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: cloudops-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: kube-state-metrics
    static_configs:
      - targets:
          - kube-state-metrics:8080
