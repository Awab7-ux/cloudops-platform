apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  namespace: cloudops-platform
  labels:
    app.kubernetes.io/part-of: cloudops-platform
spec:
  # Bind only to the project's static PV; do not require a default provisioner.
  storageClassName: ""
  volumeName: cloudops-platform-sqlite
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
