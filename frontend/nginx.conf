server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # WHY: these headers protect the browser from MIME sniffing and framing issues,
    # and they apply consistently to all responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        # WHY: hashed chunks should 404 cleanly instead of being routed through SPA fallback.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # WHY: nginx drops parent add_header directives inside a location that defines its own;
        # security headers must be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # WHY: nginx drops parent add_header directives inside a location that defines its own;
        # security headers must be repeated here.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /index.html =404;
    }

    location = /healthz {
        default_type text/plain;
        access_log off;
        add_header Content-Type text/plain always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        return 200 "ok";
    }
}
